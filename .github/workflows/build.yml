name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: 安装依赖
        working-directory: client
        # npm ci：package-lock.json 已多平台化（darwin + linux-x64 binding 均入 lock，
        # 见 rolldown/yuku-codegen/yuku-parser 三对 binding 条目），CI 按当前平台装全。
        # --legacy-peer-deps：peer（@deepseek-ai/cordis / dsh-client-runtime）由 DSH
        # 宿主提供，公共 registry 仅 pre-release（>=0.1.0 匹配不到）。
        run: npm ci --legacy-peer-deps
      - name: 类型检查（tsc --noEmit，P1-4）
        working-directory: client
        # 平台模块类型由仓库内 src/types/platform-stubs.d.ts 提供（宿主模块 CI 不存在），
        # 使 tsc 可独立运行；新增代码类型错误即红（esbuild 构建抓不到 type-only 错误）
        run: npx tsc --noEmit --skipLibCheck
      - name: 构建（tsdown → lib/）
        working-directory: client
        run: npm run build
      - name: 产物完整性
        working-directory: client
        run: |
          test -s lib/index.js || { echo "✗ lib/index.js 缺失或为空"; exit 1; }
          test -s lib/client.js || { echo "✗ lib/client.js 缺失或为空"; exit 1; }
          grep -q 'window.__ModuleLoader__.load' lib/client.js || { echo "✗ client banner 缺失"; exit 1; }
          grep -q '@wwumit/dsh-phone' lib/client.js || { echo "✗ plugin id 缺失"; exit 1; }
          echo "✓ index.js + client.js + banner + id 全部就位"
